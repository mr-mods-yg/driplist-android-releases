name: Publish signed Android release

on:
  push:
    branches:
      - release-incoming

permissions:
  contents: write

jobs:
  publish:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: public-main
          fetch-depth: 0

      - name: Verify and publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          version=$(jq -r '.versionName' build-info.json)
          tag="v${version}"
          package_id=$(jq -r '.packageId' build-info.json)
          test "$package_id" = 'in.driplist.app'
          test -s driplist.apk
          test -s RELEASE_NOTES.md

          prerelease_args=()
          release_type=stable
          if [[ "$tag" == v0.* || "$tag" == *-* ]]; then
            prerelease_args+=(--prerelease)
            release_type=prerelease
          else
            prerelease_args+=(--latest)
          fi

          RELEASE_TAG="$tag" RELEASE_VERSION="$version" RELEASE_TYPE="$release_type" \
            python3 - <<'PY'
          import datetime
          import os
          from pathlib import Path

          path = Path('public-main/CHANGELOG.md')
          text = path.read_text()
          tag = os.environ['RELEASE_TAG']
          if f'**Tag:** `{tag}`' not in text:
              header = '# Changelog\n\nPublished Driplist Android releases, newest first. Prereleases are marked explicitly.\n\n'
              if not text.startswith(header):
                  raise SystemExit('Unexpected CHANGELOG.md header; refusing to rewrite it.')
              version = os.environ['RELEASE_VERSION']
              kind = os.environ['RELEASE_TYPE']
              date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
              notes = Path('RELEASE_NOTES.md').read_text().strip()
              entry = f'## Driplist Android {version} ({kind})\n\n**Tag:** `{tag}`  \n**Published:** {date}\n\n{notes}\n\n'
              path.write_text(header + entry + text[len(header):])
          PY

          if ! git -C public-main diff --quiet -- CHANGELOG.md; then
            git -C public-main config user.name 'github-actions[bot]'
            git -C public-main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C public-main add CHANGELOG.md
            git -C public-main commit -m "Add Android ${version} changelog"
            git -C public-main push origin HEAD:main
          fi

          assets=(driplist.apk SHA256SUMS build-info.json assetlinks.json)
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$tag" --repo "$GH_REPO" \\
              --title "Driplist Android ${version}" \\
              --notes-file RELEASE_NOTES.md "${prerelease_args[@]}"
          else
            gh release create "$tag" "${assets[@]}" --repo "$GH_REPO" \\
              --target main \\
              --title "Driplist Android ${version}" \\
              --notes-file RELEASE_NOTES.md "${prerelease_args[@]}"
          fi

          gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/release-incoming" || true
